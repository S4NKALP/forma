[display]
mainDisplay = "floating"
time12h = true
clockSeconds = false
uiScale = 1.0
topGap = 4

[general]
autoHide = false
reduceMotion = false
dnd = false
pillOpacity = 1.0  # 0.0 – 1.0
pillBlur = true
unloadSec = 60  # Memory-saver cooldown after surface close

[theme]
paletteMode = "dark"

[wallpaper]
wallpaperDir = ""  # Wallpaper folder (empty = ~/Pictures/Wallpapers)
wallpaperFit = "center"  # cover | contain | center
randomScope = ""  # Random wallpaper scope

[recording]
recordCountdown = 3  # Seconds before recording starts
recordDir = "~/Videos/Recordings"  # Recording output directory
recordFps = 60  # Recording frame rate
recordQuality = "medium"  # medium | high | ultra | lossless
recordCursor = true
recordMic = false
recordDesktop = false
recordClearedBefore = 0  # Watermark for clearing recent recordings

[colors]
foreground = "#dee4e1"
background = "#0e1513"
cursor = "#dee4e1"
primary = "#83d5c6"
onPrimary = "#003730"
secondary = "#b1ccc5"
onSecondary = "#1c3530"
tertiary = "#accae5"
onTertiary = "#133348"
surface = "#0e1513"
surfaceBright = "#343b39"
error = "#ffb4ab"
errorDim = "#000000"
onError = "#690005"
errorContainer = "#93000a"
outline = "#899390"
shadow = "#000000"
red = "#ffb595"
redDim = "#000000"
green = "#95d5a7"
greenDim = "#000000"
yellow = "#b8cf84"
yellowDim = "#000000"
blue = "#afc6ff"
blueDim = "#000000"
magenta = "#e4b7f3"
magentaDim = "#000000"
cyan = "#81d5cd"
cyanDim = "#000000"
white = "#82d3e0"
